<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rate Us</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .rating-container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    .rating-container h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .star {
      font-size: 40px;
      cursor: pointer;
      color: #ccc;
      transition: transform 0.2s ease;
    }

    .star:hover,
    .star:hover ~ .star {
      color: #facc15; /* gold */
      transform: scale(1.2);
    }

    input[type="radio"] {
      display: none;
    }

    input[type="radio"]:checked ~ label.star {
      color: #facc15;
    }

    .submit-btn {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .submit-btn:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>

  

</body>
</html>
